# Prometheus + Grafana for lesson 17.2. Start:  docker compose up -d     Stop:  docker compose down
# Not run on the author's machine (no Docker there); checked for structure only.
# Ports are bound to 127.0.0.1. Grafana loads the data source and dashboard from ./grafana at start.
services:
  prometheus:
    image: prom/prometheus:v3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; Docker Desktop has it already

  grafana:
    image: grafana/grafana:12
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # read-only viewing without a login, local use only
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
