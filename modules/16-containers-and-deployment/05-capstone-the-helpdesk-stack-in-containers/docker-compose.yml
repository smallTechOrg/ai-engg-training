# The helpdesk stack: api + worker + redis + chroma. Settings from .env, the API key as a Docker secret.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:1.1.0
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma-data:/data
    restart: unless-stopped

  api:
    build: .
    image: larkspur-helpdesk-stack:1.0
    env_file: .env
    secrets:
      - llm_api_key
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chroma:8000
      LLM_API_KEY_FILE: ${LLM_API_KEY_FILE:-/run/secrets/llm_api_key}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build: .
    image: larkspur-helpdesk-stack:1.0
    env_file: .env
    secrets:
      - llm_api_key
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY_FILE: ${LLM_API_KEY_FILE:-/run/secrets/llm_api_key}
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  llm_api_key:
    file: ./secrets/llm_api_key.txt

volumes:
  redis-data: {}
  chroma-data: {}
