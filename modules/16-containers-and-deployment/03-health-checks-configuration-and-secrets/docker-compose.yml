# Uses the image built by lesson 16.2 (docker compose build there first), and shows how
# configuration and secrets are supplied to it. Configuration: environment variables.
# The API key: a Docker secret, mounted as a file at /run/secrets/llm_api_key.
services:
  api:
    image: larkspur-helpdesk-stack:0.2
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-your-model-name}
      LLM_API_KEY_FILE: ${LLM_API_KEY_FILE:-/run/secrets/llm_api_key}
      LOG_LEVEL: info
    secrets:
      - llm_api_key
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  llm_api_key:
    file: ./secrets/llm_api_key.txt
